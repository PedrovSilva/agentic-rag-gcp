
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit, API and integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag_test
          POSTGRES_USER: rag_test
          POSTGRES_PASSWORD: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_test -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rag_test:rag_test@localhost:5432/rag_test
      TEST_DATABASE_URL: postgresql://rag_test:rag_test@localhost:5432/rag_test
      GROQ_API_KEY: test-key
      HF_TOKEN: test-token
      EMBEDDING_DIMENSIONS: "384"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        working-directory: backend
        run: pytest -v
